name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      - name: Update data
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.opml
          else
            python scripts/update_news.py --output-dir data --window-hours 24
          fi

      - name: Trim archive.json if too large
        run: |
          # If archive.json > 80MB, keep only last 7 days of entries
          MAX_SIZE=80000000  # 80MB
          if [ -f data/archive.json ]; then
            SIZE=$(stat -c%s data/archive.json 2>/dev/null || stat -f%z data/archive.json)
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "archive.json is ${SIZE} bytes, trimming to last 7 days..."
              python3 -c "
import json
with open('data/archive.json', 'r') as f:
    data = json.load(f)
# Keep only entries from last 7 days (assume sorted by date, keep last ~1000 entries)
if isinstance(data, list):
    trimmed = data[-1000:]
    with open('data/archive.json', 'w') as f:
        json.dump(trimmed, f, ensure_ascii=False)
              echo "Trimmed to $(stat -c%s data/archive.json) bytes"
            else
              echo "archive.json is ${SIZE} bytes, within limit"
            fi
          fi

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-24h.json data/archive.json data/source-status.json data/waytoagi-7d.json data/title-zh-cache.json
          git commit -m "chore: update ai news snapshot"
          git push
